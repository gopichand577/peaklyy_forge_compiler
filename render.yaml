services:
  - type: web
    name: peaklyy-forge-compiler-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: EXECUTION_TIMEOUT_MS
        value: 10000
      - key: EXECUTION_RATE_LIMIT
        value: 60
